<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valiant Medieval Journey</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 1800 }, debug: false } 
            },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);
        let player, cursors, item, msgText;

        function preload() {
            this.load.image('heroina', 'protagonista.png');
            this.load.image('bosque', 'https://labs.phaser.io/assets/skies/darkstone.png');
            this.load.image('suelo', 'https://labs.phaser.io/assets/sprites/platform.png');
            this.load.image('reliquia', 'https://labs.phaser.io/assets/sprites/apple.png');
        }

        function create() {
            const worldWidth = 5000; // Nivel un poco más largo
            this.physics.world.setBounds(0, 0, worldWidth, 600);

            // Fondo
            for (let i = 0; i < 6; i++) {
                this.add.image(i * 1024, 300, 'bosque').setOrigin(0, 0.5);
            }

            // Suelo (Lo bajamos un poco más)
            let platforms = this.physics.add.staticGroup();
            for (let x = 0; x < worldWidth; x += 400) {
                platforms.create(x, 595, 'suelo').setScale(2.5).refreshBody().setTint(0x000000);
            }

            // --- AJUSTE MAESTRO DEL PERSONAJE ---
            player = this.physics.add.sprite(200, 100, 'heroina');
            
            // 1. Escala: Mantenemos un tamaño visible pero manejable
            player.setScale(0.12); 
            player.setCollideWorldBounds(true);
            
            // 2. RECORTE DE LA CAJA (HITBOX): 
            // Como tu imagen tiene mucho espacio vacío, reducimos la caja física
            // a una fracción muy pequeña para que el suelo toque sus pies reales.
            player.body.setSize(200, 350); 
            
            // 3. DESPLAZAMIENTO:
            // Movemos la caja física hacia abajo y al centro para que coincida con los pies
            player.body.setOffset(player.width/2 - 100, player.height - 400);

            // Reliquia al final
            item = this.physics.add.staticImage(4800, 520, 'reliquia').setScale(1.5);

            // Cámara
            this.cameras.main.setBounds(0, 0, worldWidth, 600);
            this.cameras.main.startFollow(player, true, 0.1, 0.1);

            // UI Estilo Valiant
            msgText = this.add.text(400, 80, 'Explora las ruinas medievales...', { 
                fontSize: '22px', 
                fill: '#ffffff',
                fontFamily: 'Verdana',
                backgroundColor: '#000000aa',
                padding: { x: 15, y: 8 }
            }).setOrigin(0.5).setScrollFactor(0);

            cursors = this.input.keyboard.createCursorKeys();
            this.physics.add.collider(player, platforms);
        }

        function update() {
            // Velocidad de caminata
            if (cursors.left.isDown) {
                player.setVelocityX(-280);
                player.flipX = true;
            } else if (cursors.right.isDown) {
                player.setVelocityX(280);
                player.flipX = false;
            } else {
                player.setVelocityX(0);
            }

            // Salto
            if (cursors.up.isDown && player.body.touching.down) {
                player.setVelocityY(-750);
            }

            // Al encontrar la manzana
            let dist = Phaser.Math.Distance.Between(player.x, player.y, item.x, item.y);
            if (item.active && dist < 120) {
                msgText.setText('¡Has recuperado la reliquia del reino!');
                item.destroy();
                this.time.delayedCall(4000, () => {
                    msgText.setText('Misión cumplida. Vuelve a casa.');
                });
            }
        }
    </script>
</body>
</html>
