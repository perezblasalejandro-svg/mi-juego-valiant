<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valiant Medieval Journey</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 1500 }, debug: false } // Aumenté gravedad para que se sienta pesado
            },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);
        let player, cursors, item, msgText;

        function preload() {
            this.load.image('heroina', 'protagonista.png');
            this.load.image('bosque', 'https://labs.phaser.io/assets/skies/darkstone.png');
            this.load.image('suelo', 'https://labs.phaser.io/assets/sprites/platform.png');
            this.load.image('reliquia', 'https://labs.phaser.io/assets/sprites/apple.png');
        }

        function create() {
            const worldWidth = 4000;
            this.physics.world.setBounds(0, 0, worldWidth, 600);

            // Fondo repetido
            for (let i = 0; i < 5; i++) {
                this.add.image(i * 1024, 300, 'bosque').setOrigin(0, 0.5);
            }

            // Suelo sólido
            let platforms = this.physics.add.staticGroup();
            for (let x = 0; x < worldWidth; x += 400) {
                let s = platforms.create(x, 590, 'suelo').setScale(2).refreshBody();
                s.setTint(0x000000); // Suelo negro para que no distraiga
            }

            // PROTAGONISTA - AJUSTES CRÍTICOS
            player = this.physics.add.sprite(200, 100, 'heroina');
            
            // 1. Escala más pequeña para que el cuadro no tape todo
            player.setScale(0.06); 
            player.setCollideWorldBounds(true);
            
            // 2. AJUSTE DE HITBOX (RECORTE DEL CUADRO)
            // Esto hace que la "caja" sólida sea pequeña y esté en los pies del dibujo
            // Ajustamos el ancho a 300 y el alto a 500 dentro de tu imagen gigante
            player.body.setSize(300, 500);
            // Desplazamos la caja al centro inferior de la imagen
            player.body.setOffset(player.width/2 - 150, player.height - 550);

            // Item al final
            item = this.physics.add.staticImage(3800, 520, 'reliquia');

            // Cámara suave
            this.cameras.main.setBounds(0, 0, worldWidth, 600);
            this.cameras.main.startFollow(player, true, 0.1, 0.1);

            // Mensaje UI estilo Valiant Hearts
            msgText = this.add.text(400, 100, 'Camina hacia el este...', { 
                fontSize: '24px', 
                fill: '#ffffff',
                fontFamily: 'Verdana',
                backgroundColor: '#00000099',
                padding: { x: 20, y: 10 }
            }).setOrigin(0.5).setScrollFactor(0);

            cursors = this.input.keyboard.createCursorKeys();
            this.physics.add.collider(player, platforms);
        }

        function update() {
            if (cursors.left.isDown) {
                player.setVelocityX(-250);
                player.flipX = true;
            } else if (cursors.right.isDown) {
                player.setVelocityX(250);
                player.flipX = false;
            } else {
                player.setVelocityX(0);
            }

            // Salto con flecha ARRIBA
            if (cursors.up.isDown && player.body.touching.down) {
                player.setVelocityY(-600);
            }

            // Interacción con la reliquia
            let dist = Phaser.Math.Distance.Between(player.x, player.y, item.x, item.y);
            if (item.active && dist < 150) {
                msgText.setText('¡Has encontrado la reliquia medieval!');
                item.destroy();
            }
        }
    </script>
</body>
</html>
