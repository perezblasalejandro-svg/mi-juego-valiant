<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valiant Medieval Journey</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 2000 }, debug: false } 
            },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);
        let player, cursors, item, msgText, particles;

        function preload() {
            this.load.image('heroina', 'protagonista.png');
            this.load.image('bosque', 'https://labs.phaser.io/assets/skies/darkstone.png');
            this.load.image('suelo', 'https://labs.phaser.io/assets/sprites/platform.png');
            this.load.image('reliquia', 'https://labs.phaser.io/assets/sprites/apple.png');
            this.load.image('niebla', 'https://labs.phaser.io/assets/particles/glass.png');
        }

        function create() {
            const worldWidth = 6000; // Nivel más largo para más aventura
            this.physics.world.setBounds(0, 0, worldWidth, 600);

            // Fondo con tinte azulado medieval
            for (let i = 0; i < 7; i++) {
                this.add.image(i * 1024, 300, 'bosque').setOrigin(0, 0.5).setTint(0x6666ff);
            }

            // Niebla ambiental (Efecto Valiant Hearts)
            particles = this.add.particles(0, 0, 'niebla', {
                x: { min: 0, max: worldWidth },
                y: { min: 400, max: 600 },
                speed: 20,
                lifespan: 5000,
                quantity: 1,
                scale: { start: 1, end: 2 },
                alpha: { start: 0.2, end: 0 },
                blendMode: 'ADD'
            });

            // Suelo (Lo bajamos al límite inferior de la pantalla)
            let platforms = this.physics.add.staticGroup();
            for (let x = 0; x < worldWidth; x += 400) {
                platforms.create(x, 595, 'suelo').setScale(2.5).refreshBody().setTint(0x111111);
            }

            // --- AJUSTE DEFINITIVO DEL PERSONAJE ---
            player = this.physics.add.sprite(200, 300, 'heroina');
            player.setScale(0.12); 
            player.setCollideWorldBounds(true);
            
            // REDUCCIÓN MÁXIMA DE LA CAJA: Solo un pequeño rectángulo en los pies
            player.body.setSize(180, 100); 
            // EMPUJE AL FONDO: Esto obliga a que el dibujo "pise" el suelo negro
            player.body.setOffset(player.width/2 - 90, player.height - 120);

            // Reliquia al final del mapa
            item = this.physics.add.staticImage(5800, 530, 'reliquia').setScale(1.8);

            // Cámara
            this.cameras.main.setBounds(0, 0, worldWidth, 600);
            this.cameras.main.startFollow(player, true, 0.1, 0.1);

            // Texto UI
            msgText = this.add.text(400, 60, 'Encuentra la reliquia en el bosque de las sombras...', { 
                fontSize: '20px', 
                fill: '#ffffff',
                fontFamily: 'Verdana',
                backgroundColor: '#000000bb',
                padding: { x: 15, y: 8 }
            }).setOrigin(0.5).setScrollFactor(0);

            cursors = this.input.keyboard.createCursorKeys();
            this.physics.add.collider(player, platforms);
        }

        function update() {
            if (cursors.left.isDown) {
                player.setVelocityX(-300);
                player.flipX = true;
            } else if (cursors.right.isDown) {
                player.setVelocityX(300);
                player.flipX = false;
            } else {
                player.setVelocityX(0);
            }

            // Salto mejorado
            if (cursors.up.isDown && player.body.touching.down) {
                player.setVelocityY(-850);
            }

            // Interacción
            let dist = Phaser.Math.Distance.Between(player.x, player.y, item.x, item.y);
            if (item.active && dist < 120) {
                msgText.setText('¡Reliquia Sagrada Obtenida!');
                item.destroy();
                this.time.delayedCall(3000, () => {
                    msgText.setText('Has salvado el reino. Gracias, valiente.');
                });
            }
        }
    </script>
</body>
</html>
