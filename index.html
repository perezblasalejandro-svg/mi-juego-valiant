<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valiant Medieval Journey</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
    <script>
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 1200 }, debug: false }
            },
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);
        let player, cursors, item, msgText;

        function preload() {
            this.load.image('heroina', 'protagonista.png');
            // Fondo Medieval: Un bosque neblinoso que encaja con el estilo Valiant Hearts
            this.load.image('bosque', 'https://labs.phaser.io/assets/skies/darkstone.png');
            this.load.image('suelo', 'https://labs.phaser.io/assets/sprites/platform.png');
            this.load.image('reliquia', 'https://labs.phaser.io/assets/sprites/apple.png');
        }

        function create() {
            // Mundo de 4000 píxeles de largo
            const worldWidth = 4000;
            this.physics.world.setBounds(0, 0, worldWidth, 600);

            // Añadimos el fondo repetido para que parezca un bosque infinito
            for (let i = 0; i < 5; i++) {
                this.add.image(i * 1024, 300, 'bosque').setOrigin(0, 0.5).setScale(1);
            }

            // Suelo de piedra oscuro
            let platforms = this.physics.add.staticGroup();
            for (let x = 0; x < worldWidth; x += 400) {
                let s = platforms.create(x, 580, 'suelo').setScale(2).refreshBody();
                s.setTint(0x333333); // Lo oscurecemos para que parezca piedra/tierra
            }

            // Protagonista (Ajuste extremo de escala para evitar el cuadro gigante)
            player = this.physics.add.sprite(200, 400, 'heroina');
            player.setScale(0.08); // Si sigue siendo grande, baja este número a 0.05
            player.setCollideWorldBounds(true);
            
            // REDUCIMOS EL CUADRO FÍSICO (Hitbox)
            // Esto hace que el juego solo detecte el centro de tu dibujo
            player.body.setSize(400, 600); 
            player.body.setOffset(player.width/2 - 200, player.height/2 - 300);

            // La Manzana/Reliquia al final del bosque
            item = this.physics.add.staticImage(3800, 520, 'reliquia');
            item.setTint(0xffd700); // Color oro

            // Cámara
            this.cameras.main.setBounds(0, 0, worldWidth, 600);
            this.cameras.main.startFollow(player, true, 0.1, 0.1);

            // UI
            msgText = this.add.text(400, 50, 'Explora el bosque medieval...', { 
                fontSize: '22px', 
                fill: '#fff',
                fontFamily: 'serif',
                fontStyle: 'italic',
                backgroundColor: '#00000088',
                padding: { x: 15, y: 10 }
            }).setOrigin(0.5).setScrollFactor(0);

            cursors = this.input.keyboard.createCursorKeys();
            this.physics.add.collider(player, platforms);
        }

        function update() {
            // Movimiento
            if (cursors.left.isDown) {
                player.setVelocityX(-250);
                player.flipX = true;
            } else if (cursors.right.isDown) {
                player.setVelocityX(250);
                player.flipX = false;
            } else {
                player.setVelocityX(0);
            }

            // SALTO (Vital para Valiant Hearts)
            if (cursors.up.isDown && player.body.touching.down) {
                player.setVelocityY(-500);
            }

            // Interacción
            let dist = Phaser.Math.Distance.Between(player.x, player.y, item.x, item.y);
            if (item.active && dist < 150) {
                msgText.setText('¡Has encontrado la reliquia sagrada!');
                item.destroy();
                this.time.delayedCall(5000, () => {
                    msgText.setText('Misión cumplida. El reino está a salvo.');
                });
            }
        }
    </script>
</body>
</html>
